name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: for f in $(find js tools -name '*.js' -o -name '*.mjs'); do node --check "$f"; done
      - name: Unit tests (beta core)
        run: node --test tests/*.test.mjs
      - name: Questionnaire docs up to date
        run: node tools/gen-questionnaires.mjs && git diff --exit-code docs/questionnaires
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Smoke test
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python3 tests/smoke.py
          python3 tests/beta_smoke.py
